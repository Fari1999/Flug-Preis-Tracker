name: Update Flight Data

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8,15 * * *"   # läuft zweimal pro Tag
  workflow_dispatch:      # erlaubt manuelles Starten

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installieren
        run: |
          pip install psycopg2-binary python-dotenv

      - name: Script ausführen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python analyze.py

      - name: Änderungen committen
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add cheapest_flight.json
          git commit -m "Update flight data" || echo "No changes"
          git push
