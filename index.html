<!DOCTYPE html>
<html>

<head>

<title>Flight Price Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
background:#f4f6f8;
margin:40px;
}

h1{
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
flex:1;
min-width:250px;
}

ul{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

canvas{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Flight Price Tracker</h1>

<div class="cards">

<div class="card">
<h3>Cheapest Flight Ever</h3>
<p id="overall"></p>
</div>

<div class="card">
<h3>Cheapest Outbound Flight</h3>
<p id="outbound"></p>
</div>

<div class="card">
<h3>Cheapest Return Flight</h3>
<p id="return"></p>
</div>

</div>

<h2>Top 10 Cheapest Return Flights</h2>

<ul id="top10returns"></ul>

<h2>Price Graphs (1 Year)</h2>

<h3>NRN → NDR</h3>
<canvas id="chart1"></canvas>

<h3>NRN → OUD</h3>
<canvas id="chart2"></canvas>

<h3>NDR → NRN</h3>
<canvas id="chart3"></canvas>

<h3>OUD → NRN</h3>
<canvas id="chart4"></canvas>

</div>

<script>

fetch("cheapest_flight.json")

.then(r => r.json())

.then(data => {

// -----------------------------
// Karten anzeigen
// -----------------------------

let o = data.cheapest_overall
let out = data.cheapest_outbound
let ret = data.cheapest_return

document.getElementById("overall").innerHTML =
o.origin + " → " + o.destination + "<br>" +
"Flight: " + o.flight_date + "<br>" +
"Price: €" + o.price

document.getElementById("outbound").innerHTML =
out.origin + " → " + out.destination + "<br>" +
"Flight: " + out.flight_date + "<br>" +
"Price: €" + out.price

document.getElementById("return").innerHTML =
ret.origin + " → " + ret.destination + "<br>" +
"Flight: " + ret.flight_date + "<br>" +
"Price: €" + ret.price

// -----------------------------
// Top 10 Rückflüge
// -----------------------------

let list = document.getElementById("top10returns")

data.top10_returns.forEach(f => {

let li = document.createElement("li")

li.textContent =
f.origin + " → " + f.destination +
" | " + f.flight_date +
" | €" + f.price

list.appendChild(li)

})

// -----------------------------
// Graphen erstellen
// -----------------------------

function makeChart(id, graph, label){

new Chart(document.getElementById(id),{

type:"line",

data:{

labels:graph.dates,

datasets:[{
label:label,
data:graph.prices,
borderWidth:2
}]

}

})

}

makeChart("chart1",data.graphs.nrn_ndr,"NRN → NDR")
makeChart("chart2",data.graphs.nrn_oud,"NRN → OUD")
makeChart("chart3",data.graphs.ndr_nrn,"NDR → NRN")
makeChart("chart4",data.graphs.oud_nrn,"OUD → NRN")

})

</script>

</body>
</html>
