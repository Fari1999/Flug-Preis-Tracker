<!DOCTYPE html>
<html>
<head>

<title>Flight Price Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
background:#f4f6f8;
margin:40px;
}

h1{
text-align:center;
}

.container{
max-width:900px;
margin:auto;
}

.cards{
display:flex;
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
flex:1;
}

ul{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

canvas{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<h1>Flight Price Tracker</h1>

<div class="cards">

<div class="card">
<h3>Cheapest Flight Ever</h3>
<p id="overall"></p>
</div>

<div class="card">
<h3>Cheapest Latest Flight</h3>
<p id="latest"></p>
</div>

</div>

<h2>Top 10 Cheapest (Latest Scan)</h2>

<ul id="top10"></ul>

<h2>Price Trend (Last 3 Months)</h2>

<canvas id="chart"></canvas>

</div>

<script>

fetch("flights_data.json")
.then(r => r.json())
.then(data => {

let o = data.cheapest_overall
let l = data.cheapest_latest

document.getElementById("overall").innerHTML =
o.origin + " → " + o.destination + "<br>" +
"Date: " + o.flight_date + "<br>" +
"Price: €" + o.price

document.getElementById("latest").innerHTML =
l.origin + " → " + l.destination + "<br>" +
"Date: " + l.flight_date + "<br>" +
"Price: €" + l.price

let list = document.getElementById("top10")

data.top10_latest.forEach(f => {

let li = document.createElement("li")

li.textContent =
f.origin + " → " + f.destination +
" | " + f.flight_date +
" | €" + f.price

list.appendChild(li)

})

const ctx = document.getElementById("chart")

new Chart(ctx, {

type: "line",

data: {

labels: data.graph.dates,

datasets: [{

label: "Flight Price",

data: data.graph.prices,

borderWidth:2

}]

}

})

})

</script>

</body>
</html>
